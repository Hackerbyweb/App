name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Lihat isi repo
        run: |
          ls -la
          find . -maxdepth 3 \( -name "gradlew" -o -name "build.gradle*" -o -name "settings.gradle*" -o -name "AndroidManifest.xml" -o -name "package.json" \) -not -path "./.git/*"
      - name: Build
        run: |
          DIR=$(dirname "$(find . -maxdepth 3 -name gradlew -not -path './.git/*' | head -n 1)")
          echo "Folder proyek: $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
