name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cari proyek
        run: |
          echo "::warning title=Isi repo::$(find . -maxdepth 3 -not -path './.git*' -not -path '*/node_modules*' | head -60 | tr '\n' ';')"
          P=$(find . -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -n1)
          if [ -z "$P" ]; then echo "::error title=Tidak ada package.json::Repo ini bukan proyek web Node"; exit 1; fi
          echo "DIR=$(dirname "$P")" >> $GITHUB_ENV
      - name: Build web
        working-directory: ${{ env.DIR }}
        run: |
          npm install
          npm run build
      - name: Bungkus jadi Android
        working-directory: ${{ env.DIR }}
        run: |
          W=dist; [ -d dist ] || W=build
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init HopShield com.hopshield.app --web-dir=$W
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/android/app/build/outputs/apk/debug/*.apk"
